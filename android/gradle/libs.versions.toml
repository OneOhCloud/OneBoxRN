[versions]
agp = "9.3.1"
junit = "4.13.2"
ndk = "29.0.14206865"
# 不显式声明时三个模块各自取 AGP 自带的默认 build-tools，那个版本已被取代，机器上没有就会
# 触发一次远程下载；钉住当前最新稳定版，三模块共用本条。
buildTools = "37.0.0"
kotlin = "2.4.10"
composeBom = "2026.06.01"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
coroutines = "1.10.2"
# 后台自动更新配置的周期载体。
work = "2.11.0"
# 商店版问 Play 有没有更新（只读判定，不走应用内更新流程）。
playAppUpdate = "2.1.0"
camerax = "1.6.1"
mlkitBarcode = "17.3.0"
# 1.5 是首个兼容 AGP 9 new DSL 的 Baseline Profile 工具链；固定当前 alpha，避免动态解析。
benchmark = "1.5.0-alpha07"
profileInstaller = "1.4.1"
testJunit = "1.3.0"
testRunner = "1.7.0"
uiAutomator = "2.4.0"
# 图标：与 Windows（WPF-UI 内嵌的同一套字形）共用 Fluent System Icons，两端按同一个名字取同一枚。
fluentIcons = "1.1.315"

[libraries]
fluent-icons = { group = "com.microsoft.design", name = "fluent-system-icons", version.ref = "fluentIcons" }
play-app-update = { group = "com.google.android.play", name = "app-update", version.ref = "playAppUpdate" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
junit = { module = "junit:junit", version.ref = "junit" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
camera-mlkit-vision = { group = "androidx.camera", name = "camera-mlkit-vision", version.ref = "camerax" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileInstaller" }
test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testJunit" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiAutomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
